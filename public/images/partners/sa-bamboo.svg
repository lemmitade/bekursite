      <stop offset="100%" stop-color="#F3BC3E" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="165" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="165" r="76" fill="none" stroke="url(#greenGrad)" stroke-width="3" opacity="0.6" />

  <!-- Stylized Bamboo Stalks Motif -->
  <!-- Left Bamboo Segment -->
  <path d="M165 215 L165 175 C165 172 168 170 171 170 L175 170 L175 215 Z" fill="url(#greenGrad)" />
  <path d="M164 167 L164 130 C164 127 167 125 170 125 L175 125 L175 167 Z" fill="url(#greenGrad)" />
  <path d="M163 122 L163 90 C163 87 166 85 169 85 L175 85 L175 122 Z" fill="url(#greenGrad)" />
  <!-- Node joints -->
  <rect x="161" y="167" width="16" height="4" rx="2" fill="url(#goldGrad)" />
  <rect x="160" y="122" width="18" height="4" rx="2" fill="url(#goldGrad)" />

  <!-- Center Bamboo Stalk (Tallest) -->
  <path d="M192 225 L192 180 C192 177 195 175 198 175 L202 175 C205 175 208 177 208 180 L208 225 Z" fill="url(#greenGrad)" />
  <path d="M192 172 L192 135 C192 132 195 130 198 130 L202 130 C205 130 208 132 208 135 L208 172 Z" fill="url(#greenGrad)" />
  <path d="M192 127 L192 80 C192 77 195 75 198 75 L202 75 C205 75 208 77 208 80 L208 127 Z" fill="url(#greenGrad)" />
  <!-- Center joints -->
  <rect x="189" y="172" width="22" height="4" rx="2" fill="url(#goldGrad)" />
  <rect x="189" y="127" width="22" height="4" rx="2" fill="url(#goldGrad)" />

  <!-- Right Bamboo Segment -->
  <path d="M225 215 L225 175 C225 172 228 170 231 170 L235 170 L235 215 Z" fill="url(#greenGrad)" />
  <path d="M225 167 L225 130 C225 127 228 125 231 125 L235 125 L235 167 Z" fill="url(#greenGrad)" />
  <path d="M225 122 L225 100 C225 97 228 95 231 95 L235 95 L235 122 Z" fill="url(#greenGrad)" />
  <!-- Right joints -->
  <rect x="223" y="167" width="14" height="4" rx="2" fill="url(#goldGrad)" />
  <rect x="223" y="122" width="14" height="4" rx="2" fill="url(#goldGrad)" />

  <!-- Bamboo Leaves -->
  <path d="M208 128 Q240 115 252 85 Q228 102 208 125 Z" fill="url(#greenGrad)" />
  <path d="M192 128 Q160 115 148 85 Q172 102 192 125 Z" fill="url(#greenGrad)" />
  <path d="M208 82 Q235 70 245 48 Q222 62 208 79 Z" fill="url(#goldGrad)" />

  <!-- Typography -->
  <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SA BAMBOO</text>
  <text x="200" y="325" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">PLC • ETHIOPIA</text>
  <text x="200" y="350" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="2">SUSTAINABLE INFRASTRUCTURE</text>
</svg>
