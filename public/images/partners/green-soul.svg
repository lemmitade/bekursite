
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradGS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071525" />
      <stop offset="50%" stop-color="#0A2218" />
      <stop offset="100%" stop-color="#071525" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGradGS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F3BC3E" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#bgGradGS)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="url(#goldGradGS)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Orbit Ring -->
  <circle cx="200" cy="165" r="90" fill="none" stroke="url(#leafGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="200" cy="165" r="76" fill="none" stroke="url(#goldGradGS)" stroke-width="3" opacity="0.6" />

  <!-- Green Soul Icon: Interlocking Eco Sprout & Soul Energy -->
  <!-- Left Wing / Leaf -->
  <path d="M200 230 C150 210 135 155 160 115 C175 90 200 90 200 135 C200 175 185 200 200 230 Z" fill="url(#leafGrad)" opacity="0.9" />
  <!-- Right Wing / Leaf (Mirrored & Uplifted) -->
  <path d="M200 230 C250 210 265 155 240 115 C225 90 200 90 200 135 C200 175 215 200 200 230 Z" fill="url(#leafGrad)" opacity="0.75" />
  <!-- Center Energy Flame / Leaf Core -->
  <path d="M200 195 C190 170 190 145 200 120 C210 145 210 170 200 195 Z" fill="url(#goldGradGS)" />
  <!-- Sprout Bud -->
  <circle cx="200" cy="115" r="7" fill="url(#goldGradGS)" />

  <!-- Geometric Base Stand -->
  <path d="M175 228 L225 228 L215 238 L185 238 Z" fill="url(#goldGradGS)" />

  <!-- Typography -->
  <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GREEN SOUL</text>
  <text x="200" y="325" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="url(#goldGradGS)" text-anchor="middle" letter-spacing="5">TRADING PLC</text>
  <text x="200" y="350" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="2">SUSTAINABLE INNOVATION</text>
</svg>
